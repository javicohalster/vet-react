name: Build y actualizar rama production

# Cada push a main compila vendor/ (PHP) y public/build (assets) en Linux
# y los empuja a la rama `production`, que es la que cPanel despliega.
#
# IMPORTANTE: el build (composer install / npm run build) debe correr
# DESPUÉS de cambiar a la rama `production`, no antes. Si se compila
# estando en `main` y luego se hace `git checkout production`, ese cambio
# de rama restaura los archivos viejos que `production` tenía trackeados
# (incluido manifest.json), pisando el build recién hecho aunque el
# commit se vea "exitoso". (Nos pasó: el CSS quedaba huérfano en el repo
# pero el manifest seguía apuntando al archivo viejo.)
on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo (main + production)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cambiar a production y traer el código de main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin production || true
          if git show-ref --verify --quiet refs/remotes/origin/production; then
            git checkout -B production origin/production
          else
            git checkout -B production
          fi
          # Sincronizamos el CÓDIGO con main sin borrar el historial de production
          git checkout main -- .
          # Limpieza defensiva: nada debe quedar del build anterior antes de compilar
          rm -rf public/build vendor

      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, zip, bcmath, pdo_mysql, fileinfo, intl, exif
          tools: composer:v2
          coverage: none

      - name: Preparar .env temporal para el build
        run: |
          cp .env.example .env
          # APP_KEY temporal solo para que artisan funcione durante el build;
          # el APP_KEY real vive en el .env del servidor, no se sube al repo.

      - name: Instalar dependencias PHP (producción)
        run: composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist --no-progress

      - name: Generar APP_KEY temporal
        run: php artisan key:generate

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilar assets (Vite)
        run: |
          npm ci
          npm run build

      - name: Empujar build a production (fast-forward, sin reescribir historia)
        run: |
          git add -f vendor public/build
          git add -A
          git commit -m "Build automático desde ${GITHUB_SHA::7}" || echo "Sin cambios que compilar"
          # push normal (sin -f): siempre es descendiente de production anterior
          git push origin production
